<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工三街七號辦公室｜工項等角剖面圖</title>
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ede4;--card:#fbf8f3;--ink:#3a3029;--mute:#8a7d70;--acc:#b98a5e;--line:#e3d8ca}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC",sans-serif;display:flex;flex-direction:column}
header{padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
h1{font:700 clamp(18px,2.4vw,24px) "Noto Serif TC",serif;margin:0}
.eb{color:var(--acc);font-size:12px;letter-spacing:.12em}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:#fff}
main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;min-width:0;touch-action:none}
#view canvas{display:block;cursor:grab}
aside{width:300px;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.ctl{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-bottom:1px solid var(--line)}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.ctl button:hover{border-color:var(--acc)}
#play{grid-column:1/3;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
#list{list-style:none;margin:0;padding:6px 8px 14px;overflow-y:auto;flex:1}
#list li{display:flex;align-items:center;gap:4px;border-bottom:1px dashed var(--line)}
.ck{display:flex;align-items:center;gap:6px;padding:8px 4px;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:#3a3029;margin:0}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #0002;flex:none}
.nm{flex:1;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:8px 2px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.nm:hover{color:var(--acc)}.nm small{color:var(--mute);font-size:11px;white-space:nowrap}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mute);background:#fffc;padding:4px 10px;border-radius:8px;pointer-events:none}
#step{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;gap:4px;flex-wrap:wrap;justify-content:center;max-width:94%}
#step.on{display:flex}#step span{padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--mute)}
#step span.done{background:#e9dccb;color:var(--ink)}#step span.cur{background:var(--ink);color:#fff;font-weight:700}
#tip{position:fixed;display:none;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none;z-index:5}
#mdl{position:fixed;inset:0;background:#2a221c88;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#mdl.on{display:flex}
.mbox{background:var(--card);border-radius:14px;max-width:720px;width:100%;max-height:min(86vh,860px);overflow-y:auto;box-shadow:0 20px 60px #0005;position:relative}
.mh{position:sticky;top:0;background:var(--card);padding:16px 54px 10px 20px;border-bottom:1px solid var(--line)}
#mt{font:700 20px "Noto Serif TC",serif;display:flex;align-items:center;gap:8px}#ms{color:var(--acc);font-size:12px;letter-spacing:.08em}
#mx{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;line-height:1}
#mb{padding:6px 20px 20px}#mb h4{margin:14px 0 4px;font-size:14px}#mb p{margin:0}#mb ol,#mb ul{margin:0;padding-left:22px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{white-space:nowrap;background:#3a3029;color:#fff;font-weight:500;padding:5px 6px;text-align:left}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:right;white-space:nowrap;font-weight:700}
.warn{color:#a04000}ul.warn li::marker{content:"⚠ "}
footer{font-size:11px;color:var(--mute);padding:6px 12px;border-top:1px solid var(--line);background:var(--card)}
#tg{display:none}
@media (max-width:820px){
 main{flex-direction:column}
 aside{width:100%;border-left:0;border-top:1px solid var(--line);max-height:42vh;transition:max-height .25s}
 body.pan aside{max-height:58px;overflow:hidden}
 #tg{display:block;grid-column:1/3}
 .ctl{grid-template-columns:repeat(4,1fr);padding:8px}.ctl button{font-size:12px;padding:6px 2px}#play{grid-column:1/5}#tg{grid-column:1/5}
 #mt{font-size:18px}.mbox{max-height:88vh}
 .hint{font-size:11px}
 header{padding:8px 12px;gap:6px}.chips span{font-size:11px;padding:1px 8px}.chips span.mh2{display:none}
}
</style></head><body>
<header><div><div class="eb">工項等角剖面圖｜可點選、可旋轉縮放</div><h1>工三街七號辦公室</h1></div>
<div class="chips"><span>施工範圍 148.52 m²（44.93 坪）</span><span>牆高 300 cm（假設）</span><span class="mh2">拿掉天花板往下看</span><span>灰色半透明＝不施工區</span><span class="mh2">2026-11-16</span></div></header>
<main><div id="view"><div id="step"></div><div class="hint">拖曳旋轉・雙指或滾輪縮放・點選工項看說明</div></div>
<aside><div class="ctl"><button id="play">▶ 依施工順序播放</button><button id="all">全部顯示</button><button id="none">全部隱藏</button><button id="reset">等角視角</button><button id="top">俯視</button><button id="tg">收合／展開工項清單</button></div>
<ul id="list"></ul></aside></main>
<footer>數量與《工三街七號辦公室_施工數量表》一致，不含價格；標「假設」「待確認」者請現場複核。家具不在工程內。</footer>
<div id="tip"></div>
<div id="mdl" role="dialog" aria-modal="true"><div class="mbox"><div class="mh"><div id="ms"></div><div id="mt"></div><button id="mx" aria-label="關閉">×</button></div><div id="mb"></div></div></div>
